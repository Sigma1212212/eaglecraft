<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch EagleCraft</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .launch {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 30px;
  }
  .launch .cube { font-size: 76px; filter: drop-shadow(0 10px 24px #0008); animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .launch h1 { font-size: 34px; margin: 0; }
  .launch p { color: var(--muted); max-width: 460px; }
  .big {
    font-size: 19px; padding: 16px 34px; border-radius: 12px; margin-top: 6px;
    box-shadow: 0 14px 36px -10px #57a64a99;
  }
</style>
</head>
<body>
<div class="launch">
  <div class="cube">🟩</div>
  <h1>EagleCraft</h1>
  <p>Click to launch the game in a clean window. (Allow pop-ups the first time —
     this is what makes it run properly instead of a black screen.)</p>
  <button class="btn big" onclick="launchBlank()">▶ Launch EagleCraft</button>
  <div class="row" style="margin-top:6px">
    <a class="btn gray small" href="/dashboard">← Dashboard</a>
    <button class="btn gray small" onclick="launchHere()">Open in this tab instead</button>
  </div>
  <p id="msg" class="msg"></p>
</div>

<script>
const CLIENT = location.origin + '/eaglercraft/index.html';

// Launch the client into a fresh about:blank window (top-level context — fixes
// the black-screen-when-embedded problem).
function launchBlank() {
  const w = window.open('about:blank', '_blank');
  const msg = document.getElementById('msg');
  if (!w) { msg.className = 'msg err'; msg.textContent = 'Pop-up blocked — allow pop-ups and click again.'; return; }
  const d = w.document;
  d.open();
  d.write('<!DOCTYPE html><html><head><title>EagleCraft</title>' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}' +
    'iframe{position:fixed;inset:0;border:0;width:100vw;height:100vh}</style></head>' +
    '<body><iframe src="' + CLIENT + '" allow="fullscreen; autoplay; gamepad; ' +
    'pointer-lock; clipboard-write; microphone; camera"></iframe></body></html>');
  d.close();
  msg.className = 'msg ok'; msg.textContent = 'Launched! Check the new window.';
}

// Fallback: replace this tab with the client as a top-level page.
function launchHere() { location.href = CLIENT; }
</script>
</body>
</html>
