<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launch EagleCraft</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .launch {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 30px;
  }
  .launch .cube { font-size: 76px; filter: drop-shadow(0 10px 24px #0008); animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .launch h1 { font-size: 34px; margin: 0; }
  .launch p { color: var(--muted); max-width: 460px; }
  .big {
    font-size: 19px; padding: 16px 34px; border-radius: 12px; margin-top: 6px;
    box-shadow: 0 14px 36px -10px #57a64a99;
  }
</style>
</head>
<body>
<div class="launch">
  <div class="cube">🟩</div>
  <h1>EagleCraft</h1>
  <p>Click to start playing.</p>
  <button class="btn big" onclick="launchGame()">▶ Launch EagleCraft</button>
  <div class="row" style="margin-top:6px">
    <a class="btn gray small" href="/dashboard">← Dashboard</a>
  </div>
  <p id="msg" class="msg"></p>
</div>

<script src="/static/launch.js"></script>
<script>
const CLIENT = location.origin + '/eaglercraft/index.html';

function launchGame() {
  const msg = document.getElementById('msg');
  msg.className = 'msg ok';
  msg.textContent = 'Loading the game…';
  openApp(CLIENT);
}
</script>
</body>
</html>
