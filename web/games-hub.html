<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(60vmax 50vmax at 15% -10%, #ff6bcb22, transparent 60%),
      radial-gradient(55vmax 50vmax at 90% 0%, #ffb86b22, transparent 60%),
      #07090f;
    color: #fff; min-height: 100vh;
  }
  .bar {
    position: sticky; top: 0; z-index: 20; display: flex; gap: 14px; align-items: center;
    padding: 14px 20px; background: #0a0d14cc; backdrop-filter: blur(8px);
    border-bottom: 1px solid #20283a;
  }
  .bar .logo { font-weight: 900; font-size: 20px; letter-spacing: .5px;
    background: linear-gradient(90deg,#ffb86b,#ff6bcb); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  .bar a.home { color: #aeb8c8; text-decoration: none; font-size: 14px; padding: 8px 12px;
    border: 1px solid #2a3344; border-radius: 8px; }
  .bar a.home:hover { background: #161c27; }
  .bar input {
    flex: 1; max-width: 420px; margin-left: auto; padding: 10px 14px; border-radius: 999px;
    border: 1px solid #2a3344; background: #11151f; color: #fff; font-size: 15px;
  }
  .bar input:focus { outline: none; border-color: #ff6bcb; }
  .count { color: #5e6b80; font-size: 13px; }

  .grid {
    display: grid; gap: 16px; padding: 22px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    max-width: 1200px; margin: 0 auto;
  }
  .game {
    position: relative; cursor: pointer; border-radius: 14px; overflow: hidden;
    background: #121826; border: 1px solid #232c3e; aspect-ratio: 1 / 1;
    display: flex; flex-direction: column; transition: transform .15s, box-shadow .25s, border-color .25s;
  }
  .game:hover { transform: translateY(-4px) scale(1.03);
    box-shadow: 0 18px 40px -16px #ff6bcb66; border-color: #ff6bcb; }
  .game .thumb { flex: 1; background: #0c1018 center/cover no-repeat; min-height: 0; }
  .game .thumb.placeholder { display: flex; align-items: center; justify-content: center;
    font-size: 40px; }
  .game .label { padding: 8px 10px; font-size: 13px; font-weight: 600; text-align: center;
    background: #0e131d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .game .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #000a; opacity: 0; transition: opacity .2s; font-weight: 800; font-size: 15px;
  }
  .game:hover .play { opacity: 1; }
  .game .play span { padding: 9px 16px; border-radius: 999px;
    background: linear-gradient(120deg,#ffb86b,#ff6bcb); color: #1a0a14; }
  .empty { text-align: center; color: #5e6b80; padding: 60px; grid-column: 1/-1; }
</style>
</head>
<body>
<div class="bar">
  <span class="logo">🎮 Games</span>
  <a class="home" href="/">← Home</a>
  <input id="search" type="text" placeholder="Search games…" oninput="render()">
  <span class="count" id="count"></span>
</div>

<div class="grid" id="grid"><div class="empty">Loading games…</div></div>

<script src="/static/launch.js"></script>
<script>
let GAMES = [];

// Pretty display name from a filename base.
function pretty(base) {
  return base
    .replace(/[_-]+/g, ' ')
    .replace(/([a-z])([A-Z0-9])/g, '$1 $2')
    .replace(/\b\w/g, c => c.toUpperCase())
    .trim();
}

// launchBlank() comes from /static/launch.js (uses an absolute URL so the
// about:blank iframe can actually resolve it).

async function load() {
  try {
    const res = await fetch('/api/games');
    const data = await res.json();
    GAMES = (data.games || []).map(g => ({ ...g, disp: pretty(g.name) }));
  } catch (e) { GAMES = []; }
  render();
}

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = GAMES.filter(g => g.disp.toLowerCase().includes(q));
  document.getElementById('count').textContent = list.length + ' games';
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty">No games found.</div>';
    return;
  }
  grid.innerHTML = list.map(g => `
    <div class="game" onclick='launchBlank(${JSON.stringify(g.file)}, ${JSON.stringify(g.disp)})' title="${g.disp}">
      ${g.img
        ? `<div class="thumb" style="background-image:url('${g.img}')"></div>`
        : `<div class="thumb placeholder">🎮</div>`}
      <div class="label">${g.disp}</div>
      <div class="play"><span>▶ Play</span></div>
    </div>`).join('');
}

load();
</script>
</body>
</html>
