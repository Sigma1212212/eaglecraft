<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(60vmax 50vmax at 20% -10%, #1b3a6b33, transparent 60%),
      radial-gradient(55vmax 50vmax at 85% 110%, #2e6b3a33, transparent 60%),
      #05070d;
    color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px;
    text-align: center;
  }
  .cube { font-size: 70px; filter: drop-shadow(0 10px 24px #0008); animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px); } }
  h1 { font-size: 32px; margin: 12px 0 8px;
    background: linear-gradient(90deg,#7fd0ff,#9cffb0); -webkit-background-clip: text;
    background-clip: text; color: transparent; }
  p { color: #9aa6b8; font-size: 15px; max-width: 420px; margin: 0 auto 26px; }
  button {
    font-size: 19px; font-weight: 800; padding: 16px 40px; border: 0; border-radius: 12px;
    cursor: pointer; color: #06121a;
    background: linear-gradient(120deg,#7fd0ff,#9cffb0); box-shadow: 0 14px 36px -10px #57a64a99;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  button:hover { filter: brightness(1.08); }
  .msg { margin-top: 18px; font-size: 13px; color: #ff8a80; min-height: 18px; }
  .small { font-size: 12px; color: #5e6b80; margin-top: 22px; }
</style>
</head>
<body>
<div>
  <div class="cube">🟩</div>
  <h1>EagleCraft</h1>
  <p>Click to open. It loads in a private <b>about:blank</b> tab — the address bar
     will just say <code>about:blank</code>, not this page.</p>
  <button id="go" onclick="openBlank()">▶ Launch</button>
  <div class="msg" id="msg"></div>
  <div class="small">If a new blank tab opens with the game, you're good. Allow pop-ups if asked.</div>
</div>

<script>
function openBlank() {
  let w;
  try { w = window.open('about:blank', '_blank'); } catch (e) { w = null; }
  if (!w) {
    document.getElementById('msg').textContent =
      'Pop-up blocked — allow pop-ups for this site, then click ▶ Launch again.';
    return;
  }
  // Put the whole app inside the about:blank tab via a full-window iframe.
  const d = w.document;
  d.open();
  d.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>​</title>' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">' +
    '<style>html,body{margin:0;height:100%;background:#05070d;overflow:hidden}' +
    'iframe{position:fixed;inset:0;border:0;width:100vw;height:100vh}</style></head>' +
    '<body><iframe src="' + location.origin + '/app" allow="fullscreen; autoplay; ' +
    'gamepad; pointer-lock; clipboard-write; microphone; camera"></iframe></body></html>');
  d.close();
  // Hide the real URL from THIS tab so nothing reveals the address.
  try { location.replace('about:blank'); } catch (e) { location.href = 'about:blank'; }
}
</script>
</body>
</html>
